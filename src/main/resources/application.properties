spring.application.name=siw-football
server.port=8081
server.forward-headers-strategy=FRAMEWORK

# ─── Base de datos ───────────────────────────────────────────────────────────
# Lee desde variables de entorno; si no existen usa los valores locales Docker
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/siw_football}
spring.datasource.username=${DB_USERNAME:siw_user}
spring.datasource.password=${DB_PASSWORD:siw_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Supabase: deshabilita preparedStatementCache (requerido en modo pooling) ─
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 0
spring.datasource.hikari.maximum-pool-size=5

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Necesario para Supabase (PostgreSQL 15+ en la nube)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Hibernate Statistics (necesario para tests N+1) ────────────────────────
spring.jpa.properties.hibernate.generate_statistics=true

# ─── Spring MVC ──────────────────────────────────────────────────────────────
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ─── Contraseñas por defecto (sobrescribibles por .env) ──────────────────────
admin.password=${ADMIN_PASSWORD:admin}
user.password=${USER_PASSWORD:1234}

# ─── OAuth2: inicio de sesión con Google ─────────────────────────────────────
# El client-id/secret se leen de variables de entorno (.env / GitHub → VPS).
# Si están vacíos, el botón de Google fallará pero el login clásico sigue OK.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:DUMMY_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:DUMMY_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ─── Cache Busting / Resource Versioning ─────────────────────────────────────
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
