<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#644a40">
    <title>Equipos — Football Manager</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link th:href="@{/css/variables.css}" rel="stylesheet"/>
    <link th:href="@{/css/global.css}" rel="stylesheet"/>
    <link th:href="@{/css/navbar.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments :: ethereal}"></div>


<nav class="navbar">
    <a th:href="@{/}" class="navbar__brand">
        <img th:src="@{/logo.webp}" alt="Logo" class="navbar__brand-logo"/>
        <span class="navbar__brand-text">Football Manager</span>
    </a>
    <div class="navbar__right">
        <div sec:authorize="isAuthenticated()" class="navbar__user">
            <strong sec:authentication="name"></strong>
        </div>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn--danger">Cerrar Sesión</button>
        </form>
        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn--outline-light">Iniciar Sesión</a>
    </div>
</nav>

<main class="main-content">
<div class="container">

    <a th:href="@{/}" class="back-link">
        <svg style="width:16px;height:16px;display:inline;vertical-align:middle;margin-right:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>Panel Principal
    </a>

    <div class="section-header">
        <h1>Todos los Equipos</h1>
    </div>

    <div th:if="${#lists.isEmpty(teams)}" class="empty-state">
        No hay equipos registrados aún.
    </div>

    <div class="grid-teams">
        <div th:each="team, iter : ${teams}" class="card-container blur-fade" th:style="'animation-delay:' + ${iter.index * 0.08} + 's;'">
            <div class="frosted-glass-card team-clickable-card" th:data-href="@{/team/{id}/players(id=${team.id})}" style="cursor: pointer; --team-color: var(--color-pitch-light);">
                <div class="frosted-card-content">
                    <div class="flex items-center gap-4 mb-4">
                        <div>
                            <h2 class="text-xl font-bold" style="color: var(--color-night);" th:text="${team.name}">Nombre del Club</h2>
                            <p style="color: var(--color-gray-600); font-size: 0.82rem; margin-top: 2px;">
                                <span th:text="${team.city}">Ciudad</span> &nbsp;·&nbsp; Fund. <span th:text="${team.foundationYear}">1900</span>
                            </p>
                        </div>
                    </div>
                    
                    <p style="color: var(--color-gray-600); font-size: 0.8rem; min-height: 40px; margin-bottom: var(--space-md);">
                        <span th:each="t : ${team.tournaments}"
                              th:text="'[' + ${t.name} + '] '"
                              style="margin-right: 4px; display: inline-block;"></span>
                        <span th:if="${#lists.isEmpty(team.tournaments)}" style="color: var(--color-gray-400);">Sin torneo asignado</span>
                    </p>

                    <div sec:authorize="hasRole('ADMIN')" class="team-dropdown-container" style="display:flex; justify-content: flex-end; margin-top: var(--space-md); position: relative; z-index: 10;">
                        <button type="button" class="btn btn--outline btn--sm team-dropdown-trigger" style="border-color: var(--color-gray-300); color: var(--color-night); padding: 4px 8px;">
                            <span>Opciones</span>
                            <svg style="width:14px;height:14px;margin-left:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div class="team-dropdown-menu" hidden style="position: absolute; right: 0; bottom: calc(100% + 6px); background: var(--color-white); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-deep); padding: var(--space-xs); display: flex; flex-direction: column; gap: 4px; min-width: 140px; z-index: 20;">
                            <button type="button" class="btn btn--ghost btn--sm edit-team-btn" style="justify-content: flex-start; width: 100%; text-align: left; font-size: 0.82rem; padding: 6px 12px; color: var(--color-night);"
                                    th:data-id="${team.id}"
                                    th:data-name="${team.name}"
                                    th:data-city="${team.city}"
                                    th:data-year="${team.foundationYear}"
                                    th:data-tournaments="${#strings.listJoin(team.tournaments.![id], ',')}">
                                <svg style="width:14px;height:14px;margin-right:6px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                Editar
                            </button>
                            <button type="button" class="btn-hold-and-release btn-delete-team" style="width: 100%; border: none !important; border-radius: var(--radius-sm);"
                                    th:data-id="${team.id}">
                                <div class="hold-progress"></div>
                                <span class="hold-content">
                                    <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                    <span class="hold-text" style="font-size: 0.82rem;">Eliminar</span>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmDeleteTeam(id) {
    Swal.fire({
        title: '¿Borrar equipo?', text: 'Se eliminará de todos los torneos donde participe.',
        icon: 'warning', showCancelButton: true,
        confirmButtonColor: '#e63946', confirmButtonText: 'Sí, borrar', cancelButtonText: 'Cancelar'
    }).then(r => { if (r.isConfirmed) window.location.href = '/admin/team/delete/' + id; });
}
</script>
<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: dock}"></div>
<script th:src="@{/js/dock.js}"></script>
<div th:replace="~{fragments :: tournamentModal}"></div>
<div th:replace="~{fragments :: teamModal}"></div>
<script th:src="@{/js/modal.js}"></script>

</body>
</html>
