<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#644a40">
    <title>Gestión de Árbitro — Football Manager</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link th:href="@{/css/variables.css}" rel="stylesheet"/>
    <link th:href="@{/css/global.css}" rel="stylesheet"/>
    <link th:href="@{/css/navbar.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments :: ethereal}"></div>


<nav class="navbar">
    <a th:href="@{/}" class="navbar__brand">
        <img th:src="@{/logo.webp}" alt="Logo" class="navbar__brand-logo"/>
        <span class="navbar__brand-text">Football Manager</span>
    </a>
    <div class="navbar__right">
        <div class="navbar__user"><strong sec:authentication="name"></strong></div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn--danger">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<main class="main-content">
<div class="container">

    <a th:href="@{/referees}" class="back-link">← Volver a la Lista</a>

    <div class="section-header">
        <h1 th:text="${referee.id == null} ? 'Registrar Árbitro' : 'Editar Árbitro'">Árbitro</h1>
    </div>

    <form th:action="@{/admin/referee/save}" th:object="${referee}" method="post" class="form card">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-grid-2">
            <div class="form__group">
                <label class="form__label">Nombre</label>
                <input type="text" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? ' form__input--error' : ''"
                       class="form__input" placeholder="Ej: Pierluigi"/>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                   style="color:#e63946;font-size:0.8rem;margin-top:4px;">Error</p>
            </div>
            <div class="form__group">
                <label class="form__label">Apellido</label>
                <input type="text" th:field="*{surname}"
                       th:classappend="${#fields.hasErrors('surname')} ? ' form__input--error' : ''"
                       class="form__input" placeholder="Ej: Collina"/>
                <p th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"
                   style="color:#e63946;font-size:0.8rem;margin-top:4px;">Error</p>
            </div>
        </div>

        <div class="form__group">
            <label class="form__label">Código Arbitral Oficial</label>
            <input type="text" th:field="*{refereeCode}"
                   th:classappend="${#fields.hasErrors('refereeCode')} ? ' form__input--error' : ''"
                   class="form__input" placeholder="Ej: REF-ITA-001"/>
            <p th:if="${#fields.hasErrors('refereeCode')}" th:errors="*{refereeCode}"
               style="color:#e63946;font-size:0.8rem;margin-top:4px;">Error</p>
        </div>

        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;">
            <span th:text="${referee.id == null} ? 'Guardar Árbitro' : 'Actualizar Datos'">Guardar</span>
        </button>
    </form>

</div>
</main>
<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: dock}"></div>
<script th:src="@{/js/dock.js}"></script>
<div th:replace="~{fragments :: tournamentModal}"></div>
<script th:src="@{/js/modal.js}"></script>

</body>
</html>
