<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#644a40">
    <title th:text="${tournament.name} + ' — Football Manager'">Torneo</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link th:href="@{/css/variables.css}" rel="stylesheet"/>
    <link th:href="@{/css/global.css}" rel="stylesheet"/>
    <link th:href="@{/css/navbar.css}" rel="stylesheet"/>
    <link th:href="@{/css/fancy-select.css}" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{fragments :: ethereal}"></div>


<nav class="navbar">
    <a th:href="@{/}" class="navbar__brand">
        <img th:src="@{/logo.webp}" alt="Logo" class="navbar__brand-logo"/>
        <span class="navbar__brand-text">Football Manager</span>
    </a>
    <div class="navbar__right">
        <div sec:authorize="isAuthenticated()" class="navbar__user">
            <strong sec:authentication="name"></strong>
        </div>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn--danger">Cerrar Sesión</button>
        </form>
        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn--outline-light">Iniciar Sesión</a>
    </div>
</nav>

<main class="main-content">
<div class="container">

    <a th:href="@{/}" class="back-link">← Volver a Inicio</a>

    <!-- Tournament header -->
    <div class="section-header">
        <div style="flex: 1;">
            <h1 th:text="${tournament.name}">Nombre del Torneo</h1>
            <p class="text-muted" style="margin-bottom: 0;">
                Fecha de inicio: <strong th:text="${tournament.startDate}">—</strong>
            </p>
        </div>
        <div sec:authorize="hasRole('ADMIN')" class="team-dropdown-container" style="position: relative; margin-top: 0; z-index: 30;">
            <button type="button" class="btn btn--outline btn--sm team-dropdown-trigger" style="border-color: var(--color-gray-300); color: var(--color-night); padding: 6px 12px;">
                <span>Opciones</span>
                <svg style="width:14px;height:14px;margin-left:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="team-dropdown-menu" style="display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--color-white); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-deep); padding: var(--space-xs); flex-direction: column; gap: 4px; min-width: 140px; z-index: 40;">
                <a th:href="@{/admin/tournament/edit/{id}(id=${tournament.id})}" class="btn btn--ghost btn--sm"
                   style="justify-content: flex-start; width: 100%; text-align: left; font-size: 0.82rem; padding: 6px 12px; color: var(--color-night);">
                    <svg style="width:14px;height:14px;margin-right:6px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    Editar
                </a>
                <button type="button" class="btn-hold-and-release btn-delete-tournament"
                        style="width: 100%; border: none !important; border-radius: var(--radius-sm);"
                        th:data-id="${tournament.id}">
                    <div class="hold-progress"></div>
                    <span class="hold-content">
                        <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        <span class="hold-text" style="font-size: 0.82rem;">Borrar</span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- Classifica — React component -->
    <div style="margin-top: var(--space-xl);">
        <h3>Clasificación</h3>
        <div id="standings-root" style="margin-top: var(--space-md);"></div>
    </div>

    <!-- Matches -->
    <div class="section-header" style="margin-top: var(--space-xl);">
        <h3 style="margin-bottom: 0;">Calendario de Encuentros</h3>
    </div>

    <div th:if="${matchPage.totalElements == 0}" class="empty-state">
        <p>Aún no hay partidos programados en este torneo.</p>
    </div>

    <div class="grid-matches">
        <div th:each="match, iter : ${matchPage.content}" class="card-container blur-fade"
             th:style="'animation-delay:' + ${iter.index * 0.06} + 's;'">
            <div class="frosted-glass-card team-clickable-card"
                 th:data-href="@{/match/{id}(id=${match.id})}" style="cursor: pointer;">
                <div class="frosted-card-content">
                    <div class="match-row">
                        <div class="match-row__teams">
                            <span class="match-row__team match-row__team--home" th:text="${match.homeTeam.name}">Local</span>
                            <div class="match-row__center">
                                <span class="state-badge"
                                      th:text="${match.status.name() == 'PLAYED'} ? 'Jugado' : 'Programado'"
                                      th:classappend="${match.status.name() == 'PLAYED'} ? ' state-badge--played' : ' state-badge--scheduled'">Estado</span>
                                <span class="match-row__score"
                                      th:text="${match.homeScore ?: 0} + ' - ' + ${match.awayScore ?: 0}">0 - 0</span>
                            </div>
                            <span class="match-row__team match-row__team--away" th:text="${match.awayTeam.name}">Visitante</span>
                        </div>

                        <div sec:authorize="hasRole('ADMIN')" class="team-dropdown-container"
                             style="position: relative; z-index: 10; flex-shrink: 0;">
                            <button type="button" class="btn btn--outline btn--sm team-dropdown-trigger"
                                    style="border-color: var(--color-gray-300); color: var(--color-night); padding: 4px 8px;">
                                <span>Opciones</span>
                                <svg style="width:14px;height:14px;margin-left:4px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </button>
                            <div class="team-dropdown-menu" style="display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--color-white); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-deep); padding: var(--space-xs); flex-direction: column; gap: 4px; min-width: 140px; z-index: 20;">
                                <button type="button" class="btn btn--ghost btn--sm edit-match-details-btn"
                                        th:data-id="${match.id}"
                                        th:data-home-team="${match.homeTeam.id}"
                                        th:data-away-team="${match.awayTeam.id}"
                                        th:data-home-score="${match.homeScore}"
                                        th:data-away-score="${match.awayScore}"
                                        th:data-location="${match.location}"
                                        th:data-status="${match.status.name()}"
                                        th:data-referee="${match.referee.id}"
                                        th:data-date="${match.matchDate}"
                                        style="justify-content: flex-start; width: 100%; text-align: left; font-size: 0.82rem; padding: 6px 12px; color: var(--color-night);">
                                    <svg style="width:14px;height:14px;margin-right:6px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                    Editar
                                </button>
                                <button type="button" class="btn-hold-and-release btn-delete-match"
                                        style="width: 100%; border: none !important; border-radius: var(--radius-sm);"
                                        th:data-id="${match.id}">
                                    <div class="hold-progress"></div>
                                    <span class="hold-content">
                                        <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                        <span class="hold-text" style="font-size: 0.82rem;">Eliminar</span>
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <p class="match-row__meta">
                        <span th:text="${#temporals.format(match.matchDate, 'dd/MM/yyyy HH:mm')}">Fecha</span>
                        <span th:text="${match.location}">Estadio</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

</div>
</main>

<!-- Inyectar el ID del torneo como variable JS — Thymeleaf procesa solo este bloque -->
<script th:inline="javascript">
    var TOURNAMENT_ID = /*[[${tournament.id}]]*/ 0;
</script>

<!-- React 18 + Babel via CDN (no build step needed) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script th:src="@{/js/standings.js}"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmDelete(id) {
    Swal.fire({
        title: '¿Borrar torneo?', text: '¡No podrás revertir esta acción!', icon: 'warning',
        showCancelButton: true, confirmButtonColor: '#2ecc71', cancelButtonColor: '#e63946',
        confirmButtonText: 'Sí, bórralo', cancelButtonText: 'Cancelar'
    }).then(r => { if (r.isConfirmed) window.location.href = '/admin/tournament/delete/' + id; });
}
function confirmDeleteMatch(id) {
    Swal.fire({
        title: '¿Eliminar partido?', text: 'Se perderán los goles y el acta.', icon: 'warning',
        showCancelButton: true, confirmButtonColor: '#2ecc71', cancelButtonColor: '#e63946',
        confirmButtonText: 'Sí, bórralo', cancelButtonText: 'Cancelar'
    }).then(r => { if (r.isConfirmed) window.location.href = '/admin/match/delete/' + id; });
}
</script>
<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: dock(isHome=false, pagePrefix=${'/tournament/' + tournament.id})}"></div>
<script th:src="@{/js/dock.js}"></script>

<!-- Modal: programar nuevo partido (solo admin) -->
<div sec:authorize="hasRole('ADMIN')" class="modal-overlay" id="match-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="match-title">
        <div class="modal-card__head">
            <h3 class="modal-card__title" id="match-title">Programar partido</h3>
            <button type="button" class="modal-card__close" data-close-modal aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
        </div>

        <form th:action="@{/admin/match/save}" method="post" class="modal-form" id="match-form">
            <input type="hidden" id="match-id" name="id"/>
            <input type="hidden" id="match-return-url" name="returnUrl"/>
            <input type="hidden" name="tournament" th:value="${tournament.id}"/>

            <div class="modal-fields-section form-grid-2">
                <div class="modal-field">
                    <label for="match-home-team">Equipo Local <span class="req">*</span></label>
                    <select id="match-home-team" name="homeTeam" required>
                        <option th:each="t : ${tournament.teams}" th:value="${t.id}" th:text="${t.name}"></option>
                    </select>
                    <input type="number" id="match-home-score" name="homeScore" min="0" placeholder="Goles local"/>
                </div>
                <div class="modal-field">
                    <label for="match-away-team">Equipo Visitante <span class="req">*</span></label>
                    <select id="match-away-team" name="awayTeam" required>
                        <option th:each="t : ${tournament.teams}" th:value="${t.id}" th:text="${t.name}"></option>
                    </select>
                    <input type="number" id="match-away-score" name="awayScore" min="0" placeholder="Goles visitante"/>
                </div>
            </div>

            <div class="modal-fields-section form-grid-2">
                <div class="modal-field">
                    <label for="match-location">Lugar <span class="req">*</span></label>
                    <input type="text" id="match-location" name="location" required placeholder="Ej: Estadio Olímpico"/>
                </div>
                <div class="modal-field">
                    <label for="match-status">Estado <span class="req">*</span></label>
                    <select id="match-status" name="status" required>
                        <option value="SCHEDULED">Programado</option>
                        <option value="PLAYED">Jugado</option>
                    </select>
                </div>
            </div>

            <div class="modal-fields-section form-grid-2">
                <div class="modal-field">
                    <label for="match-referee">Árbitro <span class="req">*</span></label>
                    <select id="match-referee" name="referee" required>
                        <option th:each="r : ${referees}" th:value="${r.id}" th:text="${r.name} + ' ' + ${r.surname}"></option>
                    </select>
                </div>
                <div class="modal-field">
                    <label for="match-date">Fecha y hora <span class="req">*</span></label>
                    <input type="datetime-local" id="match-date" name="matchDate" required/>
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-btn modal-btn--ghost" data-close-modal>Cancelar</button>
                <button type="submit" class="modal-btn modal-btn--primary">Guardar partido</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/fancy-select.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var statusSelect = document.getElementById('match-status');
    var homeScore = document.getElementById('match-home-score');
    var awayScore = document.getElementById('match-away-score');

    function toggleScores() {
        if (!statusSelect || !homeScore || !awayScore) return;
        if (statusSelect.value === 'SCHEDULED') {
            homeScore.style.display = 'none';
            homeScore.disabled = true;
            homeScore.value = '';
            awayScore.style.display = 'none';
            awayScore.disabled = true;
            awayScore.value = '';
        } else {
            homeScore.style.display = 'block';
            homeScore.disabled = false;
            awayScore.style.display = 'block';
            awayScore.disabled = false;
        }
    }

    if (statusSelect) {
        statusSelect.addEventListener('change', toggleScores);
        toggleScores();
        window.toggleEditMatchScores = toggleScores;
    }
    
    var plusBtn = document.querySelector('.dock__item--admin');
    if (plusBtn) {
        plusBtn.addEventListener('click', function() {
            setTimeout(toggleScores, 50);
        });
    }
});
</script>

</body>
</html>
