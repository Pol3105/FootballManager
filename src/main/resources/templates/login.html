<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — SIW Football</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link th:href="@{/css/variables.css}" rel="stylesheet"/>
    <link th:href="@{/css/global.css}" rel="stylesheet"/>
    <link th:href="@{/css/etheral-shadow.css}" rel="stylesheet"/>
    <link th:href="@{/css/auth.css}" rel="stylesheet"/>
</head>
<body class="auth-page">

    <!-- Fondo Ethereal Shadow -->
    <div class="ethereal-bg" aria-hidden="true">
        <svg class="ethereal-bg__svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="ethereal-filter">
                    <feTurbulence result="undulation" numOctaves="2"
                                  baseFrequency="0.0008,0.0025" seed="0" type="turbulence"/>
                    <feColorMatrix in="undulation" type="hueRotate" values="180">
                        <animate attributeName="values" from="0" to="360"
                                 dur="30s" repeatCount="indefinite"/>
                    </feColorMatrix>
                    <feColorMatrix in="dist" result="circulation" type="matrix"
                                   values="4 0 0 0 1  4 0 0 0 1  4 0 0 0 1  1 0 0 0 0"/>
                    <feDisplacementMap in="SourceGraphic" in2="circulation" scale="60" result="dist"/>
                    <feDisplacementMap in="dist" in2="undulation" scale="60" result="output"/>
                </filter>
            </defs>
        </svg>
        <div class="ethereal-bg__shape"></div>
        <div class="ethereal-bg__noise"></div>
    </div>

    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-logo-circle">⚽</div>
            <h1 class="auth-title">Bienvenido de nuevo</h1>
            <p class="auth-subtitle">Inicia sesión en SIW Football</p>
        </div>

        <div th:if="${param.error}" class="auth-error">
            ⚠️ Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="auth-error" style="background:rgba(100,74,64,0.08);border-color:rgba(100,74,64,0.3);color:var(--primary);">
            ✅ Has cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="POST" class="auth-form">
            <!-- Usuario (icono mail decorativo) -->
            <div class="auth-field">
                <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    <path d="m22 7-10 5L2 7"></path>
                </svg>
                <input type="text" id="username" name="username" class="auth-input"
                       placeholder="Tu nombre de usuario" required autofocus autocomplete="username"/>
            </div>

            <!-- Contraseña -->
            <div class="auth-field">
                <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="password" name="password" class="auth-input"
                       placeholder="••••••••" required autocomplete="current-password"
                       data-pass-input/>
                <button type="button" class="auth-pass-toggle" data-pass-toggle aria-label="Mostrar contraseña">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <div class="auth-options">
                <label class="auth-remember">
                    <input type="checkbox" name="remember-me"/> Recuérdame
                </label>
                <a th:href="@{/register}" class="auth-forgot">¿Sin cuenta?</a>
            </div>

            <button type="submit" class="auth-btn">
                Entrar
                <svg class="auth-btn__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
                </svg>
            </button>

            <div class="auth-divider">o</div>

            <!-- Login con Google (OAuth2) -->
            <a th:href="@{/oauth2/authorization/google}" class="auth-google">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18A10.97 10.97 0 0 0 1 12c0 1.77.43 3.45 1.18 4.93l3.66-2.83z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83C6.71 7.31 9.14 5.38 12 5.38z"/>
                </svg>
                Iniciar sesión con Google
            </a>
        </form>

        <p class="auth-switch">
            ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
        </p>
        <a th:href="@{/}" class="auth-back">← Volver a la web pública</a>
    </div>

    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
