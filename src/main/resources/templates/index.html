<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#644a40">
    <title>Football Manager</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/site.webmanifest}">
    <link th:href="@{/css/variables.css}" rel="stylesheet"/>
    <link th:href="@{/css/global.css}" rel="stylesheet"/>
    <link th:href="@{/css/navbar.css}" rel="stylesheet"/>
</head>
<body>

<div th:replace="~{fragments :: ethereal}"></div>

<nav class="navbar">
    <a th:href="@{/}" class="navbar__brand">
        <img th:src="@{/logo.webp}" alt="Logo" class="navbar__brand-logo"/>
        <span class="navbar__brand-text">Football Manager</span>
    </a>
    <div class="navbar__right">
        <div sec:authorize="isAuthenticated()" class="navbar__user">
            <strong sec:authentication="name"></strong>
        </div>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn--danger">Cerrar Sesión</button>
        </form>
        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn--outline-light">Iniciar Sesión</a>
    </div>
</nav>

<main class="main-content">
    <div class="container" style="padding: 0; overflow: hidden;">

        <!-- Hero header -->
        <header class="site-header blur-fade" style="animation-delay:0.02s;">
            <h1 class="site-header__title"><img th:src="@{/logo.webp}" alt="Logo" class="site-header__logo-img"/> Football Manager</h1>
            <p class="site-header__subtitle">Plataforma oficial de gestión de torneos</p>
        </header>

        <div style="padding: var(--space-xl);">
            <!-- Section header -->
            <div class="section-header blur-fade" style="animation-delay:0.06s;">
                <h2 style="margin-bottom: 0;">Torneos Activos
                    <span style="color: var(--color-gray-400); font-weight: 700;" th:text="${#lists.size(tournaments)}">0</span>
                </h2>
                <h2 style="margin-bottom: 0;">Equipos Totales
                    <span style="color: var(--color-gray-400); font-weight: 700;" th:text="${#lists.size(allTeams)}">0</span>
                </h2>
            </div>

            <!-- Tournament grid -->
            <div class="grid-tournaments">
                <a th:each="t : ${tournaments}" th:href="@{/tournament/{id}(id=${t.id})}" class="tournament-card">
                    <div class="tournament-card__banner">
                        <img th:src="@{/logo.webp}" alt="Logo" class="tournament-card__logo-img"/>
                        <span class="tournament-card__teams"
                              th:text="${#lists.size(t.teams)} + ' equipos'">0 equipos</span>
                    </div>
                    <div class="tournament-card__body">
                        <span class="tournament-card__meta">
                            Inicio: <strong th:text="${t.startDate}">01/01/2026</strong>
                        </span>
                        <span class="tournament-card__title" th:text="${t.name}">Nombre del Torneo</span>
                        <p class="tournament-card__desc" th:text="${t.description}">Descripción del torneo.</p>
                    </div>
                </a>

                <div th:if="${#lists.isEmpty(tournaments)}" class="empty-state" style="grid-column: 1 / -1;">
                    <p>No hay torneos registrados. ¡Crea el primero!</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: dock(isHome=true)}"></div>
<script th:src="@{/js/dock.js}"></script>
<div th:replace="~{fragments :: tournamentModal}"></div>
<script th:src="@{/js/modal.js}"></script>

</body>
</html>
